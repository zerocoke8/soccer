name: Deploy to GitHub Pages

# main → https://zerocoke8.github.io/soccer/
# outgame-lesson 브랜치 → https://zerocoke8.github.io/soccer/lesson/ (그 브랜치에 .lesson-site 표시 파일이 있을 때만)
# outgame-sprite 브랜치 → https://zerocoke8.github.io/soccer/sprite/ (그 브랜치에 .sprite-site 표시 파일이 있을 때만 — 2D 스프라이트 시험판)
# ingame-hex 브랜치 → https://zerocoke8.github.io/soccer/hex/ (그 브랜치에 .hex-site 표시 파일이 있을 때만 — 육각 오토배틀 시험판)
# 브랜치에 푸시하면 그 브랜치의 lesson-redeploy.yml · sprite-redeploy.yml · hex-redeploy.yml 이 이 워크플로를 main 에서 다시 실행한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LESSON_BRANCH: outgame-lesson
  SPRITE_BRANCH: outgame-sprite
  HEX_BRANCH: ingame-hex

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (site root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: src/main

      - name: Does the lesson branch exist?
        id: lesson
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${LESSON_BRANCH}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Does the sprite branch exist?
        id: sprite
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${SPRITE_BRANCH}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Does the hex branch exist?
        id: hex
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${HEX_BRANCH}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout lesson branch (/lesson/)
        if: steps.lesson.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LESSON_BRANCH }}
          path: src/lesson

      - name: Checkout sprite branch (/sprite/)
        if: steps.sprite.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SPRITE_BRANCH }}
          path: src/sprite

      - name: Checkout hex branch (/hex/)
        if: steps.hex.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEX_BRANCH }}
          path: src/hex

      - name: Assemble site
        run: |
          set -eu
          if [ -e src/main/lesson ]; then echo "::error::main has a lesson/ path that would collide with the lesson site"; exit 1; fi
          if [ -e src/main/sprite ]; then echo "::error::main has a sprite/ path that would collide with the sprite site"; exit 1; fi
          if [ -e src/main/hex ]; then echo "::error::main has a hex/ path that would collide with the hex site"; exit 1; fi
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' src/main/ _site/
          if [ -f src/lesson/.lesson-site ]; then
            mkdir -p _site/lesson
            rsync -a --exclude='.git' --exclude='.github' --exclude='/.lesson-site' --exclude='/art/' --exclude='/node_modules/' src/lesson/ _site/lesson/
            echo "lesson site deployed from $(git -C src/lesson rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "lesson site skipped (branch missing or no .lesson-site marker)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f src/sprite/.sprite-site ]; then
            mkdir -p _site/sprite
            rsync -a --exclude='.git' --exclude='.github' --exclude='/.lesson-site' --exclude='/.sprite-site' --exclude='/art/' --exclude='/node_modules/' src/sprite/ _site/sprite/
            echo "sprite site deployed from $(git -C src/sprite rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "sprite site skipped (branch missing or no .sprite-site marker)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f src/hex/.hex-site ]; then
            mkdir -p _site/hex
            rsync -a --exclude='.git' --exclude='.github' --exclude='/.lesson-site' --exclude='/.sprite-site' --exclude='/.hex-site' --exclude='/art/' --exclude='/node_modules/' src/hex/ _site/hex/
            echo "hex site deployed from $(git -C src/hex rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hex site skipped (branch missing or no .hex-site marker)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
