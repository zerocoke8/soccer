<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="로그라이크 육성 축구 게임 웹 프로토타입">
  <title>경계전 클럽 — 로그라이크 육성 축구 프로토타입</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/outgame.css">
  <link rel="stylesheet" href="./css/match.css">
</head>
<body>
  <!-- 고정 스테이지 (논리 1280×720, js/ui/stage.js 가 창에 맞춰 배율·위치를 정한다). 화면과 오버레이 루트는 전부 이 안에 -->
  <div id="stage" class="stage">
    <div id="app" class="app">
      <div class="loading">
        <div class="loading-ball">⚽</div>
        <p>데이터를 불러오는 중…</p>
      </div>
      <noscript><p class="noscript">이 프로토타입은 JavaScript가 필요합니다.</p></noscript>
    </div>
    <div id="modal-root"></div>
    <div id="banner-root"></div>
    <div id="toast-root"></div>
  </div>
  <div class="rotate-hint"><span aria-hidden="true">↻</span> 화면을 가로로 돌려 주세요</div>
  <script type="module" src="./js/ui/app.js"></script>
</body>
</html>
